<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime & Manga Vault - Custom Font</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vaultBg: 'transparent',
            vaultPanel: 'transparent',
            vaultCard: 'transparent',
            vaultBorder: 'rgba(255, 255, 255, 0.1)',
          },
          fontFamily: {
            sans: ['GNFRegular', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Font Registration */
    @font-face {
      font-family: 'GNFRegular';
      src: url('gnf.regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* Absolute No Background - Fully Transparent Base & Custom Font Application */
    html, body {
      background-color: transparent !important;
      background: transparent !important;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      color: #ffffff;
      font-family: 'GNFRegular', sans-serif !important;
    }

    input, button, select, textarea {
      font-family: 'GNFRegular', sans-serif !important;
    }

    /* Monochrome Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* Ultra-Clear Glass Header */
    .glass-header {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Strict 2:3 Poster Aspect Ratio */
    .poster-card {
      aspect-ratio: 2 / 3;
    }

    /* Shimmer Skeleton Animation */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite;
    }

    .reader-theme-dark { background-color: rgba(0, 0, 0, 0.85); color: #ffffff; backdrop-filter: blur(10px); }
    .reader-theme-gray { background-color: rgba(17, 17, 17, 0.85); color: #cccccc; backdrop-filter: blur(10px); }
    .reader-theme-light { background-color: rgba(255, 255, 255, 0.85); color: #000000; backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-transparent text-white antialiased min-h-screen flex flex-col selection:bg-white selection:text-black">

  <!-- TOP HEADER & MINIMAL SEARCH BAR -->
  <header class="sticky top-0 z-40 w-full glass-header px-2 sm:px-4 py-2.5">
    <div class="w-full flex items-center justify-between gap-2 sm:gap-4">
      
      <!-- Mode Switcher: Anime vs Manga -->
      <div class="flex items-center shrink-0">
        <div class="flex bg-black/40 border border-white/10 rounded p-0.5 backdrop-blur-md">
          <button 
            id="btnAnimeMode" 
            class="px-3 py-1 rounded text-xs font-bold transition-all flex items-center gap-1.5 bg-white text-black shadow"
          >
            <i class="fa-solid fa-tv text-[10px]"></i>
            <span class="tracking-wide">Anime</span>
          </button>
          <button 
            id="btnMangaMode" 
            class="px-3 py-1 rounded text-xs font-bold transition-all flex items-center gap-1.5 text-neutral-400 hover:text-white"
          >
            <i class="fa-solid fa-book-open text-[10px]"></i>
            <span class="tracking-wide">Manga</span>
          </button>
        </div>
      </div>

      <!-- Search Input -->
      <div class="relative flex-1 max-w-2xl mx-auto group">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-neutral-400 text-xs group-focus-within:text-white transition-colors"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search" 
          class="w-full bg-black/40 backdrop-blur-md text-xs sm:text-sm text-white placeholder-neutral-400 rounded pl-10 pr-10 py-1.5 border border-white/10 focus:border-white/40 focus:outline-none transition-all shadow-inner"
          autocomplete="off"
        >
        <button id="btnClearSearch" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-white p-1 transition-colors">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN POSTER GRID SECTION -->
  <main class="flex-1 w-full p-1 sm:p-2">
    <div 
      id="posterGrid" 
      class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 2xl:grid-cols-10 gap-1 sm:gap-2 w-full min-h-[85vh]"
    ></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden min-h-[60vh] flex flex-col items-center justify-center text-center p-6">
      <div class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center mb-3 text-neutral-400">
        <i class="fa-solid fa-ghost text-xl"></i>
      </div>
      <h3 class="text-xs font-bold text-neutral-300 uppercase tracking-widest">No Posters Found</h3>
      <button id="btnResetSearch" class="mt-4 px-4 py-1.5 bg-white text-black text-xs font-bold rounded hover:bg-neutral-200 transition-all shadow">
        Reset Search
      </button>
    </div>

    <!-- Pagination -->
    <div id="paginationContainer" class="py-8 flex justify-center items-center">
      <button 
        id="btnLoadMore" 
        class="hidden px-6 py-2 rounded bg-black/50 backdrop-blur-md hover:bg-black/70 border border-white/10 text-xs font-bold text-neutral-300 hover:text-white transition-all shadow"
      >
        <span>Load More</span>
        <i class="fa-solid fa-arrow-down text-[10px]"></i>
      </button>
    </div>
  </main>

  <!-- EMBEDDED ANIME PLAYER MODAL -->
  <div id="animePlayerModal" class="fixed inset-0 z-50 hidden flex flex-col bg-black/80 backdrop-blur-xl transition-colors duration-200">
    <header class="p-2 sm:px-4 bg-black/60 backdrop-blur-md border-b border-white/10 flex flex-wrap items-center justify-between gap-2 z-20 shrink-0">
      <div class="flex items-center gap-2 max-w-xs sm:max-w-md truncate">
        <h3 id="playerAnimeTitle" class="text-xs sm:text-sm font-bold text-white truncate">Anime Title</h3>
      </div>

      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1">
          <span class="text-xs text-neutral-400 font-semibold">Season:</span>
          <select id="playerSeasonSelect" class="bg-black/60 border border-white/10 text-xs text-neutral-300 rounded px-2 py-1 focus:outline-none">
            <option value="1">Season 1</option>
          </select>
        </div>

        <div class="flex items-center gap-1">
          <span class="text-xs text-neutral-400 font-semibold">Episode:</span>
          <select id="playerEpisodeSelect" class="bg-black/60 border border-white/10 text-xs text-neutral-300 rounded px-2 py-1 focus:outline-none">
            <option value="1">Ep 1</option>
          </select>
        </div>
      </div>

      <button id="btnCloseAnimePlayer" class="w-7 h-7 rounded bg-black/60 hover:bg-white hover:text-black border border-white/10 text-neutral-300 flex items-center justify-center transition-all">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    </header>

    <div class="flex-1 w-full bg-transparent flex items-center justify-center relative">
      <iframe id="animePlayerIframe" src="" class="w-full h-full border-0 bg-transparent" allowfullscreen></iframe>
    </div>
  </div>

  <!-- MANGA READER MODAL -->
  <div id="mangaReaderModal" class="fixed inset-0 z-50 hidden flex flex-col reader-theme-dark transition-colors duration-200">
    <header class="p-2 bg-black/60 backdrop-blur-md border-b border-white/10 flex flex-wrap items-center justify-between gap-2 z-20 shrink-0">
      <div class="flex items-center gap-2 max-w-xs sm:max-w-md truncate">
        <h3 id="readerMangaTitle" class="text-xs font-bold text-white truncate">Manga Title</h3>
      </div>
      <div class="flex items-center gap-1 flex-1 max-w-xs justify-center">
        <button id="btnReaderPrevCh" disabled class="px-2 py-1 bg-black/40 disabled:opacity-30 hover:bg-black/70 border border-white/10 rounded text-xs font-semibold text-white transition-all">
          <i class="fa-solid fa-chevron-left text-[10px]"></i>
        </button>
        <select id="readerChapterSelect" class="bg-black/60 border border-white/10 text-xs text-neutral-300 rounded px-2 py-1 focus:outline-none max-w-[160px] truncate">
          <option value="">Loading Chapters...</option>
        </select>
        <button id="btnReaderNextCh" disabled class="px-2 py-1 bg-black/40 disabled:opacity-30 hover:bg-black/70 border border-white/10 rounded text-xs font-semibold text-white transition-all">
          <i class="fa-solid fa-chevron-right text-[10px]"></i>
        </button>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btnToggleViewMode" class="p-1.5 bg-black/40 hover:bg-black/70 rounded border border-white/10 text-xs text-neutral-400 hover:text-white" title="Toggle Scroll / Page Mode">
          <i id="viewModeIcon" class="fa-solid fa-scroll"></i>
        </button>
        <button id="btnToggleTheme" class="p-1.5 bg-black/40 hover:bg-black/70 rounded border border-white/10 text-xs text-neutral-400 hover:text-white" title="Switch Theme">
          <i class="fa-solid fa-circle-half-stroke"></i>
        </button>
        <button id="btnCloseReader" class="w-6 h-6 rounded bg-black/40 hover:bg-white hover:text-black border border-white/10 text-neutral-300 flex items-center justify-center transition-all ml-1">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>
    </header>

    <div id="readerCanvasArea" class="flex-1 overflow-y-auto p-2 sm:p-4 flex flex-col items-center bg-transparent">
      <div id="readerPagesContainer" class="w-full max-w-2xl space-y-2 my-auto"></div>
    </div>

    <footer id="readerSinglePageFooter" class="hidden p-2 bg-black/60 backdrop-blur-md border-t border-white/10 flex items-center justify-center gap-4 text-xs">
      <button id="btnSinglePrevPage" class="px-3 py-1 bg-black/40 hover:bg-black/70 border border-white/10 text-white rounded">Previous Page</button>
      <span id="singlePageIndicator" class="font-mono text-neutral-400 font-semibold">Page 1 / 1</span>
      <button id="btnSingleNextPage" class="px-3 py-1 bg-black/40 hover:bg-black/70 border border-white/10 text-white rounded">Next Page</button>
    </footer>
  </div>

  <!-- JAVASCRIPT ENGINE -->
  <script>
    const ANILIST_URL = "https://graphql.anilist.co";
    const ANILIST_VAULT_QUERY = `
    query ($search: String, $page: Int, $perPage: Int, $type: MediaType) {
      Page(page: $page, perPage: $perPage) {
        pageInfo { hasNextPage }
        media(type: $type, search: $search, sort: [POPULARITY_DESC], isAdult: false) {
          id
          idMal
          title { english romaji native }
          coverImage { extraLarge large }
          bannerImage
          episodes
          chapters
          relations {
            edges {
              relationType
              node {
                id
                idMal
                title { english romaji }
                type
                format
                episodes
              }
            }
          }
          description(asHtml: false)
          trailer { id site }
          studios(isMain: true) { nodes { name } }
        }
      }
    }`;

    const state = {
      mode: 'ANIME',
      query: '',
      page: 1,
      hasMorePages: true,
      isLoading: false,
      items: [],
      activeItem: null,
      currentSeasonId: null,
      reader: {
        mangadexId: null,
        chapters: [],
        currentChapterIndex: -1,
        pages: [],
        viewMode: 'scroll',
        singlePageIndex: 0,
        theme: 'dark'
      }
    };

    const $ = id => document.getElementById(id);
    const elements = {
      btnAnimeMode: $('btnAnimeMode'),
      btnMangaMode: $('btnMangaMode'),
      searchInput: $('searchInput'),
      btnClearSearch: $('btnClearSearch'),
      posterGrid: $('posterGrid'),
      emptyState: $('emptyState'),
      btnResetSearch: $('btnResetSearch'),
      btnLoadMore: $('btnLoadMore'),
      
      animePlayerModal: $('animePlayerModal'),
      btnCloseAnimePlayer: $('btnCloseAnimePlayer'),
      playerAnimeTitle: $('playerAnimeTitle'),
      playerSeasonSelect: $('playerSeasonSelect'),
      playerEpisodeSelect: $('playerEpisodeSelect'),
      animePlayerIframe: $('animePlayerIframe'),

      mangaReaderModal: $('mangaReaderModal'),
      btnCloseReader: $('btnCloseReader'),
      readerMangaTitle: $('readerMangaTitle'),
      readerChapterSelect: $('readerChapterSelect'),
      btnReaderPrevCh: $('btnReaderPrevCh'),
      btnReaderNextCh: $('btnReaderNextCh'),
      btnToggleViewMode: $('btnToggleViewMode'),
      viewModeIcon: $('viewModeIcon'),
      btnToggleTheme: $('btnToggleTheme'),
      readerPagesContainer: $('readerPagesContainer'),
      readerSinglePageFooter: $('readerSinglePageFooter'),
      btnSinglePrevPage: $('btnSinglePrevPage'),
      btnSingleNextPage: $('btnSingleNextPage'),
      singlePageIndicator: $('singlePageIndicator')
    };

    function init() {
      setupEventListeners();
      fetchVaultData(true);
    }

    function setupEventListeners() {
      elements.btnAnimeMode.addEventListener('click', () => switchVaultMode('ANIME'));
      elements.btnMangaMode.addEventListener('click', () => switchVaultMode('MANGA'));

      let searchTimer;
      elements.searchInput.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        elements.btnClearSearch.classList.toggle('hidden', !val);
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.query = val;
          fetchVaultData(true);
        }, 350);
      });

      elements.btnClearSearch.addEventListener('click', resetSearchField);
      elements.btnResetSearch.addEventListener('click', resetSearchField);

      elements.btnLoadMore.addEventListener('click', () => {
        if (!state.isLoading && state.hasMorePages) {
          state.page++;
          renderSkeletons(false);
          fetchVaultData(false);
        }
      });

      elements.btnCloseAnimePlayer.addEventListener('click', closeAnimePlayerModal);
      
      elements.playerSeasonSelect.addEventListener('change', (e) => {
        state.currentSeasonId = e.target.value;
        updatePlayerEpisodesAndFrame();
      });

      elements.playerEpisodeSelect.addEventListener('change', () => {
        updatePlayerEpisodesAndFrame();
      });

      elements.btnCloseReader.addEventListener('click', closeMangaReader);
      elements.btnToggleViewMode.addEventListener('click', toggleReaderViewMode);
      elements.btnToggleTheme.addEventListener('click', toggleReaderTheme);

      elements.readerChapterSelect.addEventListener('change', (e) => {
        const idx = parseInt(e.target.value);
        if (!isNaN(idx)) loadMangaChapterPages(idx);
      });

      elements.btnReaderPrevCh.addEventListener('click', () => {
        if (state.reader.currentChapterIndex > 0) loadMangaChapterPages(state.reader.currentChapterIndex - 1);
      });

      elements.btnReaderNextCh.addEventListener('click', () => {
        if (state.reader.currentChapterIndex < state.reader.chapters.length - 1) loadMangaChapterPages(state.reader.currentChapterIndex + 1);
      });

      elements.btnSinglePrevPage.addEventListener('click', () => {
        if (state.reader.singlePageIndex > 0) { state.reader.singlePageIndex--; renderSinglePage(); }
      });

      elements.btnSingleNextPage.addEventListener('click', () => {
        if (state.reader.singlePageIndex < state.reader.pages.length - 1) { state.reader.singlePageIndex++; renderSinglePage(); }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeAnimePlayerModal(); closeMangaReader(); }
      });
    }

    function resetSearchField() {
      elements.searchInput.value = '';
      elements.btnClearSearch.classList.add('hidden');
      state.query = '';
      fetchVaultData(true);
    }

    function switchVaultMode(newMode) {
      if (state.mode === newMode) return;
      state.mode = newMode;
      if (newMode === 'ANIME') {
        elements.btnAnimeMode.className = "px-3 py-1 rounded text-xs font-bold transition-all flex items-center gap-1.5 bg-white text-black shadow";
        elements.btnMangaMode.className = "px-3 py-1 rounded text-xs font-bold transition-all flex items-center gap-1.5 text-neutral-400 hover:text-white";
      } else {
        elements.btnMangaMode.className = "px-3 py-1 rounded text-xs font-bold transition-all flex items-center gap-1.5 bg-white text-black shadow";
        elements.btnAnimeMode.className = "px-3 py-1 rounded text-xs font-bold transition-all flex items-center gap-1.5 text-neutral-400 hover:text-white";
      }
      fetchVaultData(true);
    }

    function renderSkeletons(reset = true) {
      const skeletons = Array(20).fill(0).map(() => `<div class="poster-card rounded skeleton-shimmer border border-white/5 relative overflow-hidden"></div>`).join('');
      if (reset) elements.posterGrid.innerHTML = skeletons;
      else elements.posterGrid.insertAdjacentHTML('beforeend', skeletons);
    }

    async function fetchVaultData(reset = true) {
      if (state.isLoading) return;
      state.isLoading = true;
      if (reset) { state.page = 1; state.items = []; renderSkeletons(true); }

      const variables = { type: state.mode, page: state.page, perPage: 30 };
      if (state.query) variables.search = state.query;

      try {
        const response = await fetch(ANILIST_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ query: ANILIST_VAULT_QUERY, variables })
        });
        if (!response.ok) throw new Error("AniList response error");
        const json = await response.json();
        const pageData = json.data?.Page;
        const newItems = (pageData?.media || []).map(item => ({ ...item, type: state.mode }));
        state.hasMorePages = pageData?.pageInfo?.hasNextPage || false;
        state.items = reset ? newItems : [...state.items, ...newItems];
        renderPosterGrid();
        elements.btnLoadMore.classList.toggle('hidden', !state.hasMorePages);
      } catch (err) {
        if (state.mode === 'ANIME') await fetchJikanFallback(reset);
        else renderPosterGrid();
      } finally {
        state.isLoading = false;
      }
    }

    async function fetchJikanFallback(reset) {
      try {
        const url = state.query ? `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(state.query)}&page=${state.page}&limit=24` : `https://api.jikan.moe/v4/top/anime?page=${state.page}&limit=24`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Jikan Error");
        const json = await res.json();
        const fallbackItems = (json.data || []).map(item => ({
          id: item.mal_id,
          idMal: item.mal_id,
          type: 'ANIME',
          title: { english: item.title_english || item.title, romaji: item.title_japanese || item.title },
          coverImage: { extraLarge: item.images?.jpg?.large_image_url, large: item.images?.jpg?.image_url },
          bannerImage: item.images?.jpg?.large_image_url,
          episodes: item.episodes,
          relations: { edges: [] },
          description: item.synopsis,
          trailer: item.trailer?.youtube_id ? { id: item.trailer.youtube_id, site: 'youtube' } : null,
          studios: { nodes: item.studios ? item.studios.map(s => ({ name: s.name })) : [] }
        }));
        state.hasMorePages = json.pagination?.has_next_page || false;
        state.items = reset ? fallbackItems : [...state.items, ...fallbackItems];
        renderPosterGrid();
        elements.btnLoadMore.classList.toggle('hidden', !state.hasMorePages);
      } catch (e) {
        if (reset) elements.posterGrid.innerHTML = '';
        elements.emptyState.classList.remove('hidden');
        elements.btnLoadMore.classList.add('hidden');
      }
    }

    function renderPosterGrid() {
      if (!state.items || state.items.length === 0) {
        elements.posterGrid.innerHTML = '';
        elements.emptyState.classList.remove('hidden');
        elements.btnLoadMore.classList.add('hidden');
        return;
      }
      elements.emptyState.classList.add('hidden');
      elements.posterGrid.innerHTML = state.items.map((item, index) => `
        <div data-index="${index}" class="poster-card group relative bg-black/20 backdrop-blur-sm rounded overflow-hidden border border-white/10 cursor-pointer transition-transform duration-200 hover:scale-[1.03] hover:z-20 hover:border-white/40 shadow-lg">
          <img src="${item.coverImage?.extraLarge || item.coverImage?.large || ''}" alt="${escapeHtml(item.title?.english || '')}" loading="lazy" class="w-full h-full object-cover transition-opacity duration-300 group-hover:opacity-90 pointer-events-none">
        </div>
      `).join('');

      elements.posterGrid.querySelectorAll('.poster-card').forEach(card => {
        card.addEventListener('click', () => {
          const idx = parseInt(card.getAttribute('data-index'));
          const item = state.items[idx];
          if (item) {
            if (item.type === 'MANGA') {
              openMangaReaderModal(item);
            } else {
              openAnimePlayerModal(item);
            }
          }
        });
      });
    }

    function openAnimePlayerModal(item) {
      state.activeItem = item;
      const title = item.title?.english || item.title?.romaji || 'Untitled Anime';
      elements.playerAnimeTitle.textContent = title;

      const seasons = [{
        id: item.id || item.idMal || 1,
        title: title,
        episodes: item.episodes || 12
      }];

      if (item.relations?.edges) {
        item.relations.edges.forEach(edge => {
          if (['SEQUEL', 'PREQUEL'].includes(edge.relationType) && edge.node?.type === 'ANIME') {
            seasons.push({
              id: edge.node.id || edge.node.idMal,
              title: edge.node.title?.english || edge.node.title?.romaji || 'Season',
              episodes: edge.node.episodes || 12
            });
          }
        });
      }

      state.currentSeasonId = seasons[0].id;
      elements.playerSeasonSelect.innerHTML = seasons.map((s, idx) => `
        <option value="${s.id}">Season ${idx + 1} (${escapeHtml(s.title)})</option>
      `).join('');

      updatePlayerEpisodesAndFrame();
      elements.animePlayerModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function updatePlayerEpisodesAndFrame() {
      const item = state.activeItem;
      let totalEpisodes = 12;

      if (item.id == state.currentSeasonId || item.idMal == state.currentSeasonId) {
        totalEpisodes = item.episodes || 12;
      } else if (item.relations?.edges) {
        const found = item.relations.edges.find(e => (e.node?.id == state.currentSeasonId || e.node?.idMal == state.currentSeasonId));
        if (found && found.node?.episodes) {
          totalEpisodes = found.node.episodes;
        }
      }

      let optionsHtml = '';
      for (let i = 1; i <= totalEpisodes; i++) {
        optionsHtml += `<option value="${i}">Ep ${i}</option>`;
      }
      elements.playerEpisodeSelect.innerHTML = optionsHtml;

      const selectedEp = elements.playerEpisodeSelect.value || 1;
      elements.animePlayerIframe.src = `https://streamrip.fun/play?type=anime&id=${state.currentSeasonId}&ep=${selectedEp}`;
    }

    function closeAnimePlayerModal() {
      elements.animePlayerModal.classList.add('hidden');
      document.body.style.overflow = '';
      elements.animePlayerIframe.src = '';
    }

    async function openMangaReaderModal(item) {
      state.activeItem = item;
      elements.readerMangaTitle.textContent = item.title?.english || item.title?.romaji || 'Manga';
      elements.mangaReaderModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      elements.readerPagesContainer.innerHTML = `<div class="text-center py-20 space-y-3"><i class="fa-solid fa-circle-notch fa-spin text-xl text-neutral-400"></i><p class="text-xs text-neutral-400">Searching MangaDex...</p></div>`;

      try {
        const cleanTitle = (item.title?.english || item.title?.romaji || '').replace(/[^\w\s]/gi, '').trim();
        const searchRes = await fetch(`https://api.mangadex.org/manga?title=${encodeURIComponent(cleanTitle)}&limit=1`);
        const searchJson = await searchRes.json();
        if (!searchJson.data?.length) throw new Error("Manga title not found on MangaDex.");

        const mangadexId = searchJson.data[0].id;
        state.reader.mangadexId = mangadexId;
        const feedRes = await fetch(`https://api.mangadex.org/manga/${mangadexId}/feed?translatedLanguage[]=en&order[chapter]=asc&limit=500`);
        const feedJson = await feedRes.json();
        if (!feedJson.data?.length) throw new Error("No English chapters available.");

        const chapterList = [];
        const seenChapters = new Set();
        feedJson.data.forEach(ch => {
          const num = ch.attributes.chapter || '?';
          if (!seenChapters.has(num)) {
            seenChapters.add(num);
            chapterList.push({ id: ch.id, chapter: num, title: ch.attributes.title || `Chapter ${num}` });
          }
        });

        chapterList.sort((a, b) => parseFloat(a.chapter) - parseFloat(b.chapter));
        state.reader.chapters = chapterList;
        elements.readerChapterSelect.innerHTML = chapterList.map((ch, i) => `<option value="${i}">Chapter ${ch.chapter}: ${escapeHtml(ch.title)}</option>`).join('');
        loadMangaChapterPages(0);
      } catch (err) {
        elements.readerChapterSelect.innerHTML = `<option value="">Unavailable</option>`;
        elements.readerPagesContainer.innerHTML = `<div class="text-center py-20 space-y-2 max-w-md mx-auto"><i class="fa-solid fa-circle-exclamation text-xl text-neutral-400"></i><h4 class="text-xs font-bold text-neutral-300">Pages Unavailable</h4><p class="text-xs text-neutral-400">${escapeHtml(err.message)}</p></div>`;
      }
    }

    async function loadMangaChapterPages(chapterIndex) {
      if (chapterIndex < 0 || chapterIndex >= state.reader.chapters.length) return;
      state.reader.currentChapterIndex = chapterIndex;
      const ch = state.reader.chapters[chapterIndex];
      elements.readerChapterSelect.value = chapterIndex;
      elements.btnReaderPrevCh.disabled = (chapterIndex === 0);
      elements.btnReaderNextCh.disabled = (chapterIndex === state.reader.chapters.length - 1);

      elements.readerPagesContainer.innerHTML = `<div class="text-center py-20 space-y-3"><i class="fa-solid fa-circle-notch fa-spin text-xl text-neutral-400"></i><p class="text-xs text-neutral-400">Loading Chapter ${escapeHtml(ch.chapter)}...</p></div>`;

      try {
        const atHomeRes = await fetch(`https://api.mangadex.org/at-home/server/${ch.id}`);
        const atHomeJson = await atHomeRes.json();
        state.reader.pages = atHomeJson.chapter.data.map(f => `${atHomeJson.baseUrl}/data/${atHomeJson.chapter.hash}/${f}`);
        state.reader.singlePageIndex = 0;
        state.reader.viewMode === 'scroll' ? renderWebtoonScroll() : renderSinglePage();
      } catch (err) {
        elements.readerPagesContainer.innerHTML = `<p class="text-center text-neutral-400 text-xs py-16">Error loading Chapter ${escapeHtml(ch.chapter)}.</p>`;
      }
    }

    function renderWebtoonScroll() {
      elements.readerSinglePageFooter.classList.add('hidden');
      elements.readerPagesContainer.innerHTML = state.reader.pages.map((url, i) => `<img src="${escapeHtml(url)}" alt="Page ${i + 1}" loading="lazy" class="w-full max-w-2xl mx-auto block my-2 border border-white/10 shadow-lg">`).join('');
    }

    function renderSinglePage() {
      elements.readerSinglePageFooter.classList.remove('hidden');
      const total = state.reader.pages.length;
      const current = state.reader.singlePageIndex;
      elements.singlePageIndicator.textContent = `Page ${current + 1} / ${total}`;
      elements.btnSinglePrevPage.disabled = (current === 0);
      elements.btnSingleNextPage.disabled = (current === total - 1);
      elements.readerPagesContainer.innerHTML = `<div class="flex items-center justify-center min-h-[70vh]"><img src="${escapeHtml(state.reader.pages[current])}" alt="Page ${current + 1}" class="max-h-[80vh] w-auto object-contain border border-white/10 shadow-lg"></div>`;
    }

    function toggleReaderViewMode() {
      state.reader.viewMode = state.reader.viewMode === 'scroll' ? 'page' : 'scroll';
      elements.viewModeIcon.className = state.reader.viewMode === 'scroll' ? "fa-solid fa-scroll" : "fa-solid fa-book-open";
      state.reader.viewMode === 'scroll' ? renderWebtoonScroll() : renderSinglePage();
    }

    function toggleReaderTheme() {
      const modal = elements.mangaReaderModal;
      if (state.reader.theme === 'dark') {
        state.reader.theme = 'gray';
        modal.className = "fixed inset-0 z-50 hidden flex flex-col reader-theme-gray transition-colors duration-200";
      } else if (state.reader.theme === 'gray') {
        state.reader.theme = 'light';
        modal.className = "fixed inset-0 z-50 hidden flex flex-col reader-theme-light transition-colors duration-200";
      } else {
        state.reader.theme = 'dark';
        modal.className = "fixed inset-0 z-50 hidden flex flex-col reader-theme-dark transition-colors duration-200";
      }
    }

    function closeMangaReader() {
      elements.mangaReaderModal.classList.add('hidden');
      document.body.style.overflow = '';
      elements.readerPagesContainer.innerHTML = '';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
